# Base-case mandate: brief §3.3 values as they stand ([CONFIRM] by Isaiah before the freeze).
# A family set to null is switched off. Numbers are plain decimals: YAML 1.1 reads 1.0e9 as text.
mandate:
  dollar: 0.02            # |1'w| <= eps_net
  beta: 0.05              # |y_mkt| <= eps_beta (loading units)
  style: 0.10             # |y_k| <= b_k, each non-market factor
  sector: 0.02            # |S_j'w| <= s_j, each GICS sector
  gross: 2.0              # 1'(w+ + w-) <= G
  position: 0.03          # w+_i, w-_i <= min(u, theta * ADV_i / AUM)
  liquidity_theta: 0.05
  aum_usd: 1000000000.0
  borrow_annual: 0.0030   # 30 bp/yr on shorts (2.5 bp/month)
  trade_cost: 0.0005      # 5 bp one-way
risk_aversion:                    # v1 fixed-λ policy; UNUSED in v2 (P-RB root-finds λ: risk_budget)
  target_annual_vol: 0.03         # v1 only
  fallback_fraction: 0.9          # v1 only (unused in v2): 90% of the maximum attainable vol
  lambda_bracket: [0.001, 100000.0]   # v1 only (unused in v2)
risk_budget:                      # v2 P-RB (DESIGN §3.2, §6): λ root-found so ex-ante vol = target
  target_annual_vol: 0.03         # 3%/yr ex-ante on capital; σ_m = 0.03/√12 monthly
  lambda_min: 0.000001            # if vol(λ_min) < target, the budget is slack: solve at λ_min
  root_rtol: 0.0000000001         # |vol/target − 1| at the root (1e-10)
solver:
  primary: GUROBI
  cross_check: CLARABEL
  threads: 1
  seed: 0
alpha:
  seed: 20261015
  synthetic_ic: [0.02, 0.05, 0.10]
  momentum_ic: 0.03
