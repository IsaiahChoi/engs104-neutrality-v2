# CHECKS is unchanged. Instances, s_obj, mandate, constraints, δ and δ_r are read from integer.yaml
# (unchanged); this file holds only the extension's own settings.
# Plain decimals with a dot (PyYAML reads 1e-6 as text).
runner: k29b_ext
status: "S3b item 2 diagnostic (GATE I, Decision 45)"
