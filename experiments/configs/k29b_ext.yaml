n_cases_expected: 36               # 6 instances at 2017-12 and 2020-03 at δ = 10% (24) + 12 at 2017-12, δ = 5%
criterion: "|s(10 s_obj) - s(s_obj)| <= 1e-5 |s| + 2N, N at s_obj (CHECKS K29b's rule)"
workers: 4
